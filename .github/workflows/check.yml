name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secret_scan:
    uses: ./.github/workflows/secrets.yml
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - name: Tarball contents and installation smoke
        shell: bash
        run: |
          set -euo pipefail
          for file in LICENSE NOTICE THIRD_PARTY_NOTICES.md SECURITY.md; do
            tar -tzf ./openfloor-cli-*.tgz "package/$file" > /dev/null
          done
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --global --prefix "$prefix" ./openfloor-cli-*.tgz
          "$prefix/bin/openfloor" --version
          "$prefix/bin/openfloor" --help
          "$prefix/bin/openfloor" doctor --json --base-url http://127.0.0.1:9 || test "$?" -eq 6
